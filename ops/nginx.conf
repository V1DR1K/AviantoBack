events {}

http {
  upstream avianto_frontend { server frontend:3000; }
  upstream avianto_backend { server app:8081; }

  server {
    listen 8080;
    server_name _;

    location /api/ {
      proxy_pass http://avianto_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    location / {
      proxy_pass http://avianto_frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
      proxy_buffering off;
    }
  }
}
