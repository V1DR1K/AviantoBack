services:
  postgres:
    image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 100
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: {driver: local, options: {max-size: 10m, max-file: "3"}}
  app:
    build: .
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    security_opt: ["no-new-privileges:true"]
    env_file: .env
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
    ports: ["127.0.0.1:8081:8081"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: {driver: local, options: {max-size: 10m, max-file: "3"}}
volumes:
  postgres_data:
