spring:
  application.name: avianto-back
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/avianto}
    username: ${POSTGRES_USER:avianto}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  flyway.enabled: true
  cache:
    type: caffeine
    caffeine.spec: maximumSize=1000,expireAfterWrite=10m
  jackson.time-zone: UTC
server:
  port: ${PORT:8081}
  error.include-message: never
app:
  jwt.secret: ${JWT_SECRET}
  jwt.access-minutes: ${JWT_ACCESS_MINUTES:15}
  jwt.refresh-days: ${JWT_REFRESH_DAYS:14}
  timezone: America/Argentina/Buenos_Aires
  cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:https://avianto.neticar.com.ar}
springdoc:
  swagger-ui.path: /swagger-ui.html
